<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="relative min-h-screen bg-black text-white overflow-y-auto">
    <img src="images/Fondo_login.png" alt="Collage de series" class="absolute inset-0 w-full h-full object-cover brightness-50" loading="lazy" width="1920" height="1080"/>
    
    <header class="relative z-10 p-6">
      <h1 class="text-4xl font-extrabold text-blue-600 tracking-widest select-none font-netflix">
        TECFLIX
      </h1>
    </header>

    <main class="relative z-10 flex justify-center items-center px-4 pb-12">
      <form class="bg-black bg-opacity-80 max-w-md w-full p-8 rounded-md" aria-label="Formulario de inicio de sesión de Netflix">
        <h2 class="text-2xl font-extrabold mb-6 text-center">Iniciar sesión</h2>

        <input type="email" placeholder="Email o número de celular" class="w-full mb-4 p-3 rounded bg-[#333333] placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-red-600" autocomplete="username" required />
        
        <input type="password" placeholder="Contraseña" class="w-full mb-6 p-3 rounded bg-[#333333] placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-red-600" autocomplete="current-password" required />
        
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-extrabold py-3 rounded mb-6 transition-colors">
          Iniciar sesión
        </button>

        <p class="text-center mb-6 text-gray-300">o</p>

        <button type="button" class="w-full bg-gray-700 bg-opacity-70 hover:bg-opacity-90 font-extrabold py-3 rounded mb-6 transition-colors">
          Usar un código de inicio de sesión
        </button>

        <p class="text-center mb-4 underline text-sm">
          <a href="#" class="text-white hover:text-gray-300">¿Olvidaste la contraseña?</a>
        </p>

        <div class="flex items-center mb-4">
          <input id="remember" type="checkbox" class="w-4 h-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500" checked />
          <label for="remember" class="ml-2 font-extrabold text-white select-none">Recordarme</label>
        </div>

        <p class="text-gray-300 text-sm mb-1">
          ¿Primera vez en Tecflix?
          <strong class="font-extrabold cursor-pointer hover:underline">Suscríbete ya.</strong>
        </p>

        <p class="text-gray-500 text-xs leading-tight">
          Esta página está protegida por Google reCAPTCHA para comprobar que no eres un robot.
        </p>

        <p class="text-blue-600 text-xs mt-1 cursor-pointer hover:underline">Más info.</p>
      </form>
    </main>
  </div>
</body>
</html>
